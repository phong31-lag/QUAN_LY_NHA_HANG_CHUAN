name: Tự Động Đồng Bộ cPanel (Auto Deploy to cPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dong-bo-ftp:
    name: Tự động tải code lên cPanel qua FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Lấy mã nguồn mới nhất từ GitHub
        uses: actions/checkout@v4

      - name: 📂 Đồng bộ mã nguồn lên cPanel qua LFTP
        continue-on-error: true
        env:
          FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOST=$(echo "$FTP_SERVER_RAW" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "🌐 Kết nối đến máy chủ FTP: $HOST"
          echo "👤 Tài khoản: $FTP_USER"

          lftp -e "set ssl:verify-certificate no; set ftp:ssl-allow true; set ftp:ssl-force false; set ftp:ssl-protect-data true; set ftp:passive-mode true; set net:timeout 30; set net:max-retries 3; mirror -R --verbose=1 --no-perms --no-umask --ignore-time --exclude-glob .git/ --exclude-glob .github/ ./ /; bye" -u "$FTP_USER","$FTP_PASS" "$HOST"

      - name: 🔄 Kích hoạt làm mới ứng dụng trên cPanel
        run: |          PHAN_HOI=$(curl -s -X POST "https://tainguyenpremium.store""/api/tu-dong-dong-bo")
          echo "📮 Phản hồi từ máy chủ cPanel:"
          echo "$PHAN_HOI"
          echo "✅ Đã kích hoạt đồng bộ thành công!"
          echo "🚀 Gửi yêu cầu làm mới đến máy chủ..."  workflow_dispatch:

